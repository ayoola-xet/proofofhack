<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; }
  .pill {
    position: absolute; left: 64px; bottom: 64px;
    background: rgba(27, 66, 53, 0.94);
    border-radius: 12px;
    padding: 16px 26px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .pill strong { color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="pill"><strong>THE SECURITY RESEARCHER</strong></div>
</body>
</html>
