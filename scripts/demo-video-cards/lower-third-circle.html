<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; }
  .pill {
    position: absolute; left: 64px; bottom: 64px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(27, 66, 53, 0.94);
    border-radius: 12px;
    padding: 16px 26px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #6cf2c4; flex: none; }
  .text strong { color: #ffffff; font-size: 22px; font-weight: 700; }
  .text span { color: #cfe8dd; font-size: 20px; font-weight: 400; margin-left: 10px; }
</style>
</head>
<body>
  <div class="pill">
    <div class="dot"></div>
    <div class="text"><strong>Circle</strong><span>Executes the guaranteed USDC payout</span></div>
  </div>
</body>
</html>
