<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: #f6f7f3;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 34px; }
  img { width: 320px; height: auto; }
  h1 {
    font-size: 38px; font-weight: 700; color: #1b4235;
    text-align: center; max-width: 1100px; line-height: 1.4;
  }
  p {
    font-size: 26px; font-weight: 500; color: #577354;
    text-align: center; max-width: 1000px; line-height: 1.5;
  }
  .partners {
    display: flex; gap: 28px; margin-top: 10px;
    font-size: 20px; font-weight: 700; color: #2d5f4a;
    letter-spacing: 0.02em;
  }
  .partners span { opacity: 0.55; font-weight: 400; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="LOGO_SRC" />
    <h1>Guaranteed payouts for researchers.<br>Private reports for protocols.</h1>
    <p>Built on Arc, Circle, The Graph, and Privy.</p>
  </div>
</body>
</html>
