specVersion: 1.3.0
description: Standardized public ERC-4626 observations for VulnProof coverage.
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: SavingsDAI
    network: mainnet
    source:
      address: '0x83f20f44975d03b1b09e64809b757c47f942beea'
      abi: ERC4626
      startBlock: 25929600
    context:
      chainId:
        type: String
        data: '1'
      implementationLabel:
        type: String
        data: 'Sky sDAI'
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Vault, VaultObservation, VaultFlow, SourceCursor]
      abis:
        - name: ERC4626
          file: ./abis/ERC4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 10
      file: ./mapping.ts
  - kind: ethereum
    name: SavingsUSDS
    network: mainnet
    source:
      address: '0xa3931d71877c0e7a3148cb7eb4463524fec27fbd'
      abi: ERC4626
      startBlock: 25929600
    context:
      chainId:
        type: String
        data: '1'
      implementationLabel:
        type: String
        data: 'Sky sUSDS'
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Vault, VaultObservation, VaultFlow, SourceCursor]
      abis:
        - name: ERC4626
          file: ./abis/ERC4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 10
      file: ./mapping.ts
  - kind: ethereum
    name: StakedUSDe
    network: mainnet
    source:
      address: '0x9d39a5de30e57443bff2a8307a4256c8797a3497'
      abi: ERC4626
      startBlock: 25929600
    context:
      chainId:
        type: String
        data: '1'
      implementationLabel:
        type: String
        data: 'Ethena sUSDe'
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
